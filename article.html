<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - 个人博客</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="container">
        <a href="index.html" class="logo">My Blog</a>
        <ul class="nav-links">
          <li><a href="index.html">首页</a></li>
          <li><a href="about.html">关于</a></li>
          <li><a href="index.html#categories">分类</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="article-detail">
      <a href="index.html" class="back-link">← 返回首页</a>
      
      <div class="article-detail-header">
        <h1 class="article-detail-title" id="articleTitle"></h1>
        <div class="article-detail-meta">
          <span>作者：<span id="articleAuthor"></span></span>
          <span>日期：<span id="articleDate"></span></span>
          <span>分类：<span id="articleCategory"></span></span>
        </div>
        <div class="tags" id="articleTags"></div>
      </div>

      <img id="articleImage" alt="" class="article-image" style="max-height: 400px; object-fit: cover; border-radius: 12px;">

      <div class="article-detail-content" id="articleContent"></div>

      <section class="comments-section">
        <h3>评论</h3>
        <div id="commentsContainer"></div>
      </section>

      <section class="related-articles">
        <h3>相关文章</h3>
        <div class="related-list" id="relatedContainer"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 My Blog. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
